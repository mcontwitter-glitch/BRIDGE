# Cloudflare Worker for Ordinals delivery. Deployed (closed) — see ../../GO_LIVE.md.
name = "bridge-ordinals"
account_id = "6492a246aad487a95f20f8f0b8cbd03f"
main = "dist/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
no_bundle = true            # bundled by build/bundle.js (swaps fs-based modules for Worker shims)

# Custom domain route (approved by BIG).
routes = [{ pattern = "ordinals.bigfoot404.biz", custom_domain = true }]

[triggers]
crons = ["*/10 * * * *"]    # same 10-minute retry loop (queued / revealing / sweeping)

[[durable_objects.bindings]]
name = "DELIVERIES"
class_name = "Deliveries"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Deliveries"]

[vars]
ORDINALS_NETWORK = "mainnet"
ORDINALS_MODE = "recursive"
ORDINALS_DATA_DIR = "/tmp"  # unused in the Worker (records live in the Durable Object)
# ORDINALS_SINK_ADDRESS = "0x…"   # set after the sink deploy + setPeer(30110, sink); until then POST returns 503
# Secret (never in this file): wrangler secret put ORDINALS_INSCRIBER_WIF
